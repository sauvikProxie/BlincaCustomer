<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#E23744" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<link
			rel="preload"
			href="/fonts/google-sans-latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<!-- Headings use 600: without this the heading text swaps fonts late and LCP jumps by seconds on slow networks. -->
		<link
			rel="preload"
			href="/fonts/google-sans-latin-600-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<script>
			// Applies the saved theme before first paint so there is no flash of
			// the wrong one. Must stay inline and synchronous. Storage can throw
			// (private mode, blocked site data), in which case we fall through to
			// prefers-color-scheme.
			try {
				var t = localStorage.getItem('blinca-theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {
				/* no stored preference available */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
